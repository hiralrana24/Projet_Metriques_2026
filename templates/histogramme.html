<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Histogramme Températures Paris</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    #chart { width: 100%; height: 520px; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Températures à Paris — Histogramme</h1>
  <div id="chart"></div>
  <div id="status"></div>
  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    async function init() {
      try {
        const res = await fetch('/paris', { headers: { 'Accept': 'application/json' } });
        const json = await res.json();

        const data = new google.visualization.DataTable();
        data.addColumn('string', 'Date/Heure');
        data.addColumn('number', 'Température (°C)');

        json.forEach(p => {
          data.addRow([p.datetime, Number(p.temperature_c)]);
        });

        const options = {
          title: 'Températures horaires à Paris (7 jours)',
          legend: { position: 'none' },
          hAxis: { title: 'Date/Heure', slantedText: true },
          vAxis: { title: '°C' },
          colors: ['#4285F4']
        };

        const chart = new google.visualization.ColumnChart(document.getElementById('chart'));
        chart.draw(data, options);
        document.getElementById('status').textContent = `OK — ${json.length} points chargés`;
      } catch (err) {
        document.getElementById('status').textContent = "Erreur: " + err.message;
      }
    }
  </script>
</body>
</html>
