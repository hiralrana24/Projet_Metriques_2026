<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
      font-size: 2em;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1em;
      transition: border-color 0.3s;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #667eea;
    }
    textarea {
      height: 120px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    button:hover { opacity: 0.9; }
    .emoji { text-align: center; font-size: 3em; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">✉️</div>
    <h1>Contactez-moi</h1>
    <div class="form-group">
      <label>Prénom</label>
      <input type="text" placeholder="Votre prénom" />
    </div>
    <div class="form-group">
      <label>Nom</label>
      <input type="text" placeholder="Votre nom" />
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea placeholder="Votre message..."></textarea>
    </div>
    <button>Envoyer 🚀</button>
  </div>
</body>
</html>
